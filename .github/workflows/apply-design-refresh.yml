name: Apply design refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-design-refresh.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply homepage and castle refresh
        shell: bash
        run: |
          set -euo pipefail
          git apply .release/index-design-refresh.patch
          rm -rf .release .github/workflows/apply-design-refresh.yml

      - name: Commit refreshed design
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh homepage and castle design"
          git push
