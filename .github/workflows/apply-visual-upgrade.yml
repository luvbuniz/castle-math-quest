name: Apply visual upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-visual-upgrade.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static art assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

          mkdir -p assets/avatars assets/rewards

          crop_webp() {
            local source="$1" x="$2" size="$3" output="$4"
            dwebp "$source" -crop "$x" 0 "$size" "$size" -o /tmp/crop.png
            cwebp -quiet -q 72 /tmp/crop.png -o "$output"
          }

          crop_webp .release/avatars-a.webp 0 180 assets/avatars/fox-knight.webp
          crop_webp .release/avatars-a.webp 180 180 assets/avatars/owl-wizard.webp
          crop_webp .release/avatars-a.webp 360 180 assets/avatars/bunny-archer.webp
          crop_webp .release/avatars-b.webp 0 180 assets/avatars/dragon-friend.webp
          crop_webp .release/avatars-b.webp 180 180 assets/avatars/cat-royal.webp

          crop_webp .release/rewards.webp 0 90 assets/rewards/crown.webp
          crop_webp .release/rewards.webp 90 90 assets/rewards/cape.webp
          crop_webp .release/rewards.webp 180 90 assets/rewards/shield.webp
          crop_webp .release/rewards.webp 270 90 assets/rewards/boots.webp
          crop_webp .release/rewards.webp 360 90 assets/rewards/wand.webp
          crop_webp .release/rewards.webp 450 90 assets/rewards/gem.webp

          sed -i 's/\r$//' .release/index.patch
          git apply .release/index.patch
          rm -rf .release .github/workflows/apply-visual-upgrade.yml

      - name: Commit visual upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade character and reward art"
          git push
