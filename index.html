<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#31256b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f7c95c' stroke='%233e317e' stroke-width='4' d='m8 20 10 9 14-18 14 18 10-9-5 32H13z'/%3E%3C/svg%3E">
  <title>Castle Math Quest</title>
  <style>
    :root {
      --ink: #252246;
      --purple: #5f4bb6;
      --purple-dark: #3e317e;
      --gold: #f7c95c;
      --cream: #fff9e8;
      --sky: #bfe8ff;
      --green: #45a66b;
      --rose: #ef709d;
      --blue: #4f8edc;
      --card: rgba(255, 255, 255, .94);
      --shadow: 0 12px 0 rgba(58, 45, 111, .14), 0 18px 35px rgba(37, 34, 70, .16);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #8fd0f3; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      background: linear-gradient(#91d8ff 0 58%, #8bd177 58% 100%);
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      touch-action: manipulation;
    }
    button:focus-visible, input:focus-visible {
      outline: 4px solid #fff;
      box-shadow: 0 0 0 7px var(--purple-dark);
    }
    button:disabled { cursor: not-allowed; }
    .app { min-height: 100vh; position: relative; isolation: isolate; }
    .sky-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      width: 160px;
      height: 42px;
      border-radius: 50px;
      background: rgba(255,255,255,.72);
      animation: drift 24s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before { width: 66px; height: 66px; left: 25px; bottom: 4px; }
    .cloud::after { width: 82px; height: 82px; right: 18px; bottom: 0; }
    .cloud.c1 { top: 10%; left: -180px; }
    .cloud.c2 { top: 27%; left: -230px; animation-delay: -11s; animation-duration: 31s; transform: scale(.75); }
    @keyframes drift { to { transform: translateX(calc(100vw + 380px)); } }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px clamp(12px, 3vw, 30px);
      color: #fff;
      background: rgba(49, 37, 107, .93);
      border-bottom: 4px solid var(--gold);
      position: relative;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      font-weight: 900;
      letter-spacing: .02em;
    }
    .brand-crown { font-size: 1.7rem; filter: drop-shadow(0 2px 0 #7d5a00); }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn {
      min-width: 46px;
      min-height: 44px;
      padding: 8px 11px;
      border-radius: 14px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-weight: 800;
      border: 2px solid rgba(255,255,255,.35);
    }
    .icon-btn[aria-pressed="true"] { background: var(--gold); color: #3d306d; }

    main { min-height: calc(100vh - 68px); }
    .screen {
      width: min(1120px, 100%);
      margin: 0 auto;
      min-height: calc(100vh - 68px);
      padding: clamp(18px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: appear .35s ease-out both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } }
    .panel {
      width: 100%;
      background: var(--card);
      border: 5px solid #fff;
      border-radius: 32px;
      padding: clamp(20px, 4vw, 42px);
      box-shadow: var(--shadow);
      position: relative;
    }
    .panel::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(95,75,182,.17);
      border-radius: 21px;
      pointer-events: none;
    }
    .content-layer { position: relative; z-index: 1; }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2.2rem, 8vw, 5rem);
      line-height: .98;
      margin-bottom: 16px;
      color: var(--purple-dark);
      text-shadow: 0 4px 0 #e5d8ff;
    }
    h2 { font-size: clamp(1.8rem, 5vw, 3rem); color: var(--purple-dark); }
    h3 { color: var(--purple-dark); }
    .eyebrow {
      color: #795e13;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-weight: 900;
      font-size: .9rem;
    }
    .lead { font-size: clamp(1.08rem, 2.8vw, 1.38rem); line-height: 1.55; }
    .primary, .secondary, .small-btn {
      min-height: 56px;
      border-radius: 18px;
      padding: 13px 22px;
      font-weight: 900;
      font-size: 1.08rem;
      transition: transform .16s ease, filter .16s ease;
      position: relative;
      z-index: 1;
    }
    .primary {
      color: #33265e;
      background: linear-gradient(#ffe28c, var(--gold));
      border: 3px solid #fff4c9;
      box-shadow: 0 7px 0 #b78118, 0 11px 20px rgba(78,53,10,.2);
    }
    .secondary {
      color: #fff;
      background: linear-gradient(#7360cf, var(--purple));
      border: 3px solid #c7bbff;
      box-shadow: 0 7px 0 #392d79;
    }
    .small-btn {
      min-height: 44px;
      padding: 8px 15px;
      font-size: .94rem;
      color: #fff;
      background: var(--purple);
      border: 2px solid #c8beff;
    }
    .primary:hover, .secondary:hover, .small-btn:hover, .icon-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .primary:active, .secondary:active, .small-btn:active { transform: translateY(4px); }
    .button-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

    /* Welcome and castle art */
    .welcome-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 30px; }
    .castle-hero { min-height: 390px; position: relative; display: grid; place-items: end center; }
    .castle-svg { width: min(100%, 500px); height: auto; filter: drop-shadow(0 15px 8px rgba(39,38,75,.2)); }
    .torch-flame { transform-origin: center bottom; animation: flicker .48s ease-in-out infinite alternate; }
    @keyframes flicker { to { transform: scale(.85,1.15) rotate(3deg); opacity: .82; } }
    .sparkle {
      position: absolute;
      color: #fff6a8;
      font-size: 1.7rem;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .sparkle.s1 { top: 13%; left: 11%; }
    .sparkle.s2 { top: 29%; right: 9%; animation-delay: -.7s; }
    .sparkle.s3 { top: 4%; right: 35%; animation-delay: -1.2s; }
    @keyframes twinkle { 50% { transform: scale(.45) rotate(35deg); opacity: .35; } }

    /* Avatar selection and reusable avatar art */
    .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 25px 0; }
    .avatar-card {
      min-height: 210px;
      padding: 12px;
      border-radius: 23px;
      background: #f6f0ff;
      border: 4px solid transparent;
      box-shadow: 0 6px 0 #d8cced;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 900;
    }
    .avatar-card:hover { transform: translateY(-4px); }
    .avatar-card.selected { border-color: var(--gold); background: #fff9dc; box-shadow: 0 7px 0 #ba8d27; }
    .avatar-art {
      width: 138px;
      height: 138px;
      max-width: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 7px 4px rgba(51, 38, 94, .18));
      animation: hero-float 2.4s ease-in-out infinite alternate;
    }
    @keyframes hero-float { to { transform: translateY(-5px) rotate(1deg); } }
    .avatar-label { text-transform: capitalize; line-height: 1.15; }

    /* Castle map */
    .map-screen { align-items: flex-start; }
    .map-shell { width: 100%; }
    .map-heading { display: flex; justify-content: space-between; gap: 18px; align-items: center; margin-bottom: 20px; }
    .hero-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 20px;
      padding: 8px 14px 8px 8px;
      background: #fff;
      box-shadow: 0 5px 0 rgba(62,49,126,.16);
      font-weight: 900;
    }
    .hero-chip .avatar-art { width: 68px; height: 68px; }
    .map-path {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 22px 14px;
      padding: 28px 20px;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.7) 0 5%, transparent 5.5%),
        linear-gradient(145deg, #a4df89, #62b982);
      border: 7px solid #fff;
      border-radius: 34px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .map-path::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 49%;
      border-top: 14px dotted rgba(255,244,190,.8);
      transform: rotate(7deg);
    }
    .level-node {
      min-height: 170px;
      border-radius: 27px;
      background: rgba(255,255,255,.95);
      border: 4px solid #fff;
      box-shadow: 0 8px 0 rgba(55,88,62,.24);
      padding: 14px 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .level-node:nth-child(even) { transform: translateY(18px); }
    .level-node.unlocked:hover { animation: bob .55s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-4px); } }
    .level-node:nth-child(even).unlocked:hover { animation-name: bob-even; }
    @keyframes bob-even { to { transform: translateY(13px); } }
    .level-node.locked { filter: grayscale(.75); opacity: .7; background: #e9e9e9; }
    .level-icon { font-size: 2.35rem; }
    .level-name { font-size: .92rem; font-weight: 900; line-height: 1.15; }
    .node-number {
      position: absolute;
      top: -12px;
      left: -7px;
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--purple);
      border: 3px solid #fff;
      font-weight: 900;
    }
    .meter {
      width: 100%;
      height: 16px;
      border-radius: 20px;
      overflow: hidden;
      background: #e0dced;
      border: 2px solid #fff;
    }
    .meter-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #52b977, #a7dc5d);
      transition: width .45s ease;
    }
    .mastery-label { font-size: .78rem; font-weight: 900; }

    /* Question play */
    .question-shell { width: min(920px, 100%); }
    .quest-head { display: grid; grid-template-columns: auto 1fr auto; gap: 15px; align-items: center; margin-bottom: 20px; }
    .mini-avatar .avatar-art { width: 92px; height: 92px; }
    .quest-meta h2 { font-size: clamp(1.3rem, 4vw, 2rem); margin-bottom: 7px; }
    .difficulty-stars { color: #bd8614; font-size: 1.18rem; letter-spacing: .1em; }
    .question-card {
      text-align: center;
      background: #fff;
      border: 5px solid #e9e0ff;
      border-radius: 28px;
      padding: clamp(20px, 4vw, 35px);
      box-shadow: inset 0 -8px 0 #f4efff;
    }
    .question-prompt {
      font-size: clamp(1.45rem, 4.2vw, 2.25rem);
      line-height: 1.35;
      font-weight: 900;
      margin: 0 auto 18px;
      max-width: 760px;
    }
    .visual-stage {
      min-height: 90px;
      display: grid;
      place-items: center;
      margin: 8px 0 18px;
    }
    .visual-stage:empty { display: none; }
    .math-visual { max-width: min(100%, 500px); max-height: 210px; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .choice {
      min-height: 72px;
      border-radius: 20px;
      padding: 12px;
      background: #f0ecff;
      border: 4px solid #d9cff8;
      color: var(--purple-dark);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 900;
      box-shadow: 0 6px 0 #beb1e5;
    }
    .choice:hover:not(:disabled) { transform: translateY(-3px); background: #fff8d7; border-color: var(--gold); }
    .choice.correct { background: #d8f7df; border-color: #55b875; box-shadow: 0 6px 0 #31864f; }
    .choice.try-again { background: #fff2d8; border-color: #f2bd56; box-shadow: 0 6px 0 #bd8223; }
    .feedback {
      min-height: 78px;
      margin-top: 18px;
      padding: 15px 18px;
      border-radius: 18px;
      background: #fff8de;
      font-size: 1.08rem;
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
    .feedback.success { background: #dcf7e4; color: #20663b; }
    .question-actions { justify-content: center; margin-top: 17px; }

    /* Complete, closet, and dashboard */
    .complete-panel { text-align: center; overflow: hidden; }
    .celebration { font-size: clamp(4rem, 12vw, 8rem); animation: celebrate .65s ease-in-out infinite alternate; }
    @keyframes celebrate { to { transform: translateY(-8px) rotate(4deg) scale(1.04); } }
    .celebration-stage {
      min-height: 220px;
      display: grid;
      place-items: center;
      position: relative;
      margin-top: -10px;
    }
    .celebration-stage .avatar-art { width: 230px; height: 230px; }
    .celebration-burst {
      position: absolute;
      font-size: 2rem;
      color: #d99919;
      animation: twinkle 1.2s ease-in-out infinite alternate;
    }
    .celebration-burst.b1 { left: 18%; top: 18%; }
    .celebration-burst.b2 { right: 18%; top: 8%; animation-delay: -.4s; }
    .celebration-burst.b3 { right: 24%; bottom: 10%; animation-delay: -.8s; }
    .reward-card {
      width: min(360px, 100%);
      margin: 18px auto 26px;
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(145deg, #fff9d9, #f3d57f);
      border: 4px solid #fff;
      box-shadow: 0 8px 0 #b98220;
    }
    .reward-icon { font-size: 4rem; }
    .reward-art {
      width: 112px;
      height: 112px;
      display: inline-block;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(83, 56, 10, .18));
    }
    .reward-art.small { width: 64px; height: 64px; }
    .reward-art.tiny { width: 30px; height: 30px; vertical-align: middle; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(34,27,72,.75);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .modal {
      width: min(900px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fffaf0;
      border: 5px solid #fff;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      padding: clamp(20px, 4vw, 34px);
      position: relative;
    }
    .modal-close { position: absolute; top: 12px; right: 12px; }
    .closet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .reward-tile {
      min-height: 145px;
      border-radius: 20px;
      padding: 12px 8px;
      background: #fff;
      border: 3px solid #e4d8fa;
      text-align: center;
      font-weight: 900;
    }
    .reward-tile.locked { filter: grayscale(1); opacity: .58; }
    .reward-tile .reward-icon { font-size: 2.8rem; }
    .reward-tile .reward-art { width: 76px; height: 76px; }
    .dashboard-panel { align-self: flex-start; }
    .dashboard-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 24px; }
    .summary-card { border-radius: 20px; padding: 16px; background: #f0ebff; text-align: center; }
    .summary-card strong { display: block; font-size: 2rem; color: var(--purple-dark); }
    .table-wrap { overflow-x: auto; border-radius: 18px; border: 3px solid #e2d8f6; }
    table { width: 100%; border-collapse: collapse; background: #fff; min-width: 730px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e8e1f1; }
    th { background: var(--purple-dark); color: #fff; }
    tr:last-child td { border-bottom: 0; }
    .dashboard-actions { margin-top: 20px; justify-content: space-between; }
    .danger { background: #a83f5d; border-color: #f1a7ba; box-shadow: 0 6px 0 #70273c; }
    .hidden { display: none !important; }

    @media (max-width: 850px) {
      .welcome-grid { grid-template-columns: 1fr; text-align: center; }
      .welcome-grid .button-row { justify-content: center; }
      .castle-hero { min-height: 280px; }
      .avatar-grid { grid-template-columns: repeat(3, 1fr); }
      .map-path { grid-template-columns: repeat(3, 1fr); }
      .closet-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .topbar { align-items: flex-start; }
      .brand span:last-child { display: none; }
      .top-actions { gap: 5px; }
      .icon-btn { min-width: 42px; padding: 7px; }
      .screen { padding: 14px; }
      .panel { padding: 22px 16px; border-radius: 24px; }
      .avatar-grid { grid-template-columns: repeat(2, 1fr); }
      .avatar-card { min-height: 180px; }
      .map-heading { align-items: flex-start; flex-direction: column; }
      .map-path { grid-template-columns: repeat(2, 1fr); padding: 22px 12px; }
      .level-node:nth-child(even) { transform: none; }
      .level-node:nth-child(even).unlocked:hover { animation-name: bob; }
      .quest-head { grid-template-columns: auto 1fr; }
      .quest-head > .small-btn { grid-column: 1 / -1; }
      .choice-grid { grid-template-columns: 1fr; }
      .dashboard-summary { grid-template-columns: 1fr; }
      .closet-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="sky-decor" aria-hidden="true">
      <div class="cloud c1"></div><div class="cloud c2"></div>
    </div>
    <header class="topbar">
      <div class="brand"><span class="brand-crown" aria-hidden="true">♛</span><span>Castle Math Quest</span></div>
      <div class="top-actions" aria-label="Game controls">
        <button class="icon-btn" id="narrationToggle" type="button" aria-pressed="false" title="Narration off">🗣️ <span class="control-text">Off</span></button>
        <button class="icon-btn" id="soundToggle" type="button" aria-pressed="false" title="Sound effects off">🔔 <span class="control-text">Off</span></button>
        <button class="icon-btn" id="musicToggle" type="button" aria-pressed="false" title="Music off">🎵 <span class="control-text">Off</span></button>
        <button class="icon-btn" id="dashboardToggle" type="button" title="Open grown-up dashboard">📊</button>
      </div>
    </header>
    <main id="game" tabindex="-1"></main>
    <div id="modalRoot"></div>
    <div id="announcer" class="hidden" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    "use strict";

    /* ------------------------------------------------------------------
       GAME CONTENT
       The sequence moves from number sense into operations, applications,
       and visual/spatial concepts commonly practiced during second grade.
       ------------------------------------------------------------------ */
    const LEVELS = [
      { name: "Place Value", short: "Place Value", icon: "🏰", reward: ["Jeweled Crown", "👑", "assets/rewards/crown.webp"] },
      { name: "Addition Within 100", short: "Addition", icon: "➕", reward: ["Star Cape", "🦸", "assets/rewards/cape.webp"] },
      { name: "Subtraction Within 100", short: "Subtraction", icon: "➖", reward: ["Moon Shield", "🛡️", "assets/rewards/shield.webp"] },
      { name: "One-Step Word Problems", short: "Word Problems", icon: "📜", reward: ["Story Satchel", "🎒"] },
      { name: "Skip Counting", short: "Skip Counting", icon: "🪜", reward: ["Swift Boots", "🥾", "assets/rewards/boots.webp"] },
      { name: "Time to 5 Minutes", short: "Time", icon: "🕰️", reward: ["Clockwork Pin", "⏱️"] },
      { name: "Money With Coins", short: "Money", icon: "🪙", reward: ["Golden Purse", "👛"] },
      { name: "Measure & Compare", short: "Measurement", icon: "📏", reward: ["Builder Belt", "🧰"] },
      { name: "Simple Fractions", short: "Fractions", icon: "🥧", reward: ["Fraction Wand", "🪄", "assets/rewards/wand.webp"] },
      { name: "Shapes & Geometry", short: "Geometry", icon: "🔷", reward: ["Royal Gem", "💎", "assets/rewards/gem.webp"] }
    ];

    const AVATARS = [
      { id: "fox", name: "fox knight", image: "assets/avatars/fox-knight.webp" },
      { id: "owl", name: "owl wizard", image: "assets/avatars/owl-wizard.webp" },
      { id: "bunny", name: "bunny archer", image: "assets/avatars/bunny-archer.webp" },
      { id: "dragon", name: "dragon friend", image: "assets/avatars/dragon-friend.webp" },
      { id: "cat", name: "cat royal", image: "assets/avatars/cat-royal.webp" }
    ];

    /* ------------------------------------------------------------------
       GAME STATE
       All progress intentionally lives only in memory. Mastery never falls.
       Correct answers award 12 points, or 8 after a scaffolded hint. At 90
       points a skill is mastered and the next castle location unlocks.
       ------------------------------------------------------------------ */
    function freshStats() {
      return LEVELS.map(() => ({
        mastery: 0, streak: 0, attempts: 0, correct: 0, difficulty: 1, mastered: false
      }));
    }

    const state = {
      screen: "welcome",
      avatar: null,
      currentLevel: 0,
      unlockedLevel: 0,
      stats: freshStats(),
      rewards: [],
      currentQuestion: null,
      hintStep: 0,
      answered: false,
      audio: { narration: false, sound: false, music: false },
      previousScreen: "welcome"
    };

    const game = document.getElementById("game");
    const modalRoot = document.getElementById("modalRoot");
    const announcer = document.getElementById("announcer");
    let lastNarration = "";

    /* ------------------------------------------------------------------
       SMALL HELPERS
       ------------------------------------------------------------------ */
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const pick = array => array[rand(0, array.length - 1)];
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const shuffle = array => {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = rand(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };
    const formatMoney = cents => `$${(cents / 100).toFixed(2)}`;
    const formatTime = (hour, minute) => `${hour}:${String(minute).padStart(2, "0")}`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);

    function numericChoices(answer, spread = 10, min = 0, max = 1000) {
      const values = new Set([answer]);
      let guard = 0;
      while (values.size < 4 && guard++ < 100) {
        let candidate = answer + pick([-2, -1, 1, 2]) * rand(1, spread);
        candidate = clamp(candidate, min, max);
        if (candidate !== answer) values.add(candidate);
      }
      for (let n = min; values.size < 4 && n <= max; n++) values.add(n);
      return shuffle([...values]);
    }

    function announce(text) {
      announcer.textContent = "";
      window.setTimeout(() => { announcer.textContent = text; }, 20);
    }

    function setScreen(screen) {
      state.screen = screen;
      closeModal();
      render();
      window.scrollTo(0, 0);
      game.focus({ preventScroll: true });
    }

    /* ------------------------------------------------------------------
       INLINE SVG ART
       ------------------------------------------------------------------ */
    function avatarArt(avatarId) {
      const avatar = AVATARS.find(item => item.id === avatarId) || AVATARS[0];
      return `<img class="avatar-art" src="${avatar.image}" alt="${escapeHtml(avatar.name)}" width="224" height="224">`;
    }

    function rewardArt(reward, size = "") {
      if (reward[2]) {
        return `<img class="reward-art ${size}" src="${reward[2]}" alt="${escapeHtml(reward[0])}" width="112" height="112">`;
      }
      return `<span class="reward-icon" aria-hidden="true">${reward[1]}</span>`;
    }

    function castleSvg() {
      return `
        <svg class="castle-svg" viewBox="0 0 520 420" role="img" aria-label="A cheerful purple castle">
          <ellipse cx="260" cy="395" rx="230" ry="24" fill="rgba(55,90,58,.25)"/>
          <path d="M76 349V167h84v54h54V125h92v96h54v-54h84v182z" fill="#8a76d0" stroke="#47387c" stroke-width="8"/>
          <path d="M64 168h108l-14-40-19 18-22-22-22 22-19-18zM348 168h108l-14-40-19 18-22-22-22 22-19-18zM201 126h118l-13-42-23 19-23-26-23 26-23-19z" fill="#6550ad" stroke="#47387c" stroke-width="7"/>
          <path d="M224 349v-71q36-45 72 0v71z" fill="#3c306d"/><path d="M239 349v-65q21-28 42 0v65z" fill="#f1c45d"/>
          <g fill="#bfe8ff" stroke="#47387c" stroke-width="6"><path d="M99 210q18-24 36 0v39H99z"/><path d="M385 210q18-24 36 0v39h-36z"/><path d="M241 167q19-27 38 0v43h-38z"/></g>
          <g><path d="M170 260h15v72h-15z" fill="#70482d"/><path class="torch-flame" d="M177 265q-24-23 1-48 22 27 2 49z" fill="#ffb02e"/><path class="torch-flame" d="M177 258q-11-13 1-27 10 14 1 27z" fill="#fff28d"/></g>
          <g><path d="M335 260h15v72h-15z" fill="#70482d"/><path class="torch-flame" d="M342 265q-24-23 1-48 22 27 2 49z" fill="#ffb02e"/><path class="torch-flame" d="M342 258q-11-13 1-27 10 14 1 27z" fill="#fff28d"/></g>
          <path d="M260 76V24l67 21-67 20" fill="#ef709d" stroke="#47387c" stroke-width="6"/><path d="M260 23v62" stroke="#47387c" stroke-width="7"/>
        </svg>`;
    }

    function clockSvg(hour, minute) {
      const minuteAngle = minute * 6;
      const hourAngle = (hour % 12) * 30 + minute * .5;
      const numbers = Array.from({ length: 12 }, (_, i) => {
        const n = i + 1;
        const angle = n * Math.PI / 6;
        return `<text x="${100 + Math.sin(angle) * 66}" y="${105 - Math.cos(angle) * 66}" text-anchor="middle" font-size="16" font-weight="bold" fill="#3e317e">${n}</text>`;
      }).join("");
      return `<svg class="math-visual" viewBox="0 0 200 200" role="img" aria-label="Clock showing ${formatTime(hour, minute)}">
        <circle cx="100" cy="100" r="91" fill="#fff9dc" stroke="#5f4bb6" stroke-width="8"/>
        ${numbers}
        <line x1="100" y1="100" x2="100" y2="53" stroke="#3e317e" stroke-width="8" stroke-linecap="round" transform="rotate(${hourAngle} 100 100)"/>
        <line x1="100" y1="100" x2="100" y2="30" stroke="#ef709d" stroke-width="5" stroke-linecap="round" transform="rotate(${minuteAngle} 100 100)"/>
        <circle cx="100" cy="100" r="8" fill="#f7c95c" stroke="#3e317e" stroke-width="3"/>
      </svg>`;
    }

    function coinSvg(coins) {
      const labels = { 1: ["1¢", "#c9825f"], 5: ["5¢", "#bbc4cd"], 10: ["10¢", "#d7dde2"], 25: ["25¢", "#b8c0c8"] };
      return `<svg class="math-visual" viewBox="0 0 ${Math.max(250, coins.length * 75)} 100" role="img" aria-label="Coins worth ${coins.reduce((a,b) => a+b, 0)} cents">
        ${coins.map((coin, index) => {
          const x = 42 + index * 72;
          return `<circle cx="${x}" cy="50" r="${coin === 10 ? 28 : 33}" fill="${labels[coin][1]}" stroke="#6a6370" stroke-width="4"/>
            <circle cx="${x}" cy="50" r="${coin === 10 ? 22 : 27}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-dasharray="4 3"/>
            <text x="${x}" y="57" text-anchor="middle" font-size="18" font-weight="bold" fill="#40394b">${labels[coin][0]}</text>`;
        }).join("")}
      </svg>`;
    }

    function fractionSvg(parts, shaded) {
      const colors = ["#ef709d", "#f7c95c", "#62b982", "#73a7e0"];
      const width = 360 / parts;
      return `<svg class="math-visual" viewBox="0 0 400 130" role="img" aria-label="${shaded} of ${parts} equal parts shaded">
        ${Array.from({ length: parts }, (_, i) => `<rect x="${20 + i * width}" y="20" width="${width}" height="90" fill="${i < shaded ? colors[i % colors.length] : "#fff"}" stroke="#3e317e" stroke-width="4"/>`).join("")}
      </svg>`;
    }

    function rulerSvg(a, b) {
      return `<svg class="math-visual" viewBox="0 0 480 170" role="img" aria-label="Two ribbons, ${a} inches and ${b} inches long">
        <text x="20" y="34" font-size="18" font-weight="bold" fill="#3e317e">Ribbon A</text>
        <rect x="120" y="14" width="${a * 20}" height="30" rx="10" fill="#ef709d"/>
        <text x="20" y="94" font-size="18" font-weight="bold" fill="#3e317e">Ribbon B</text>
        <rect x="120" y="74" width="${b * 20}" height="30" rx="10" fill="#4f8edc"/>
        <path d="M120 135h300" stroke="#9b704b" stroke-width="8"/>
        ${Array.from({length: 16}, (_, i) => `<path d="M${120 + i*20} 128v${i % 5 === 0 ? 25 : 17}" stroke="#614731" stroke-width="3"/><text x="${120+i*20}" y="167" text-anchor="middle" font-size="11">${i}</text>`).join("")}
      </svg>`;
    }

    function shapeSvg(shape) {
      const shapes = {
        triangle: '<polygon points="100,18 180,152 20,152" fill="#f7c95c" stroke="#3e317e" stroke-width="7"/>',
        square: '<rect x="30" y="20" width="140" height="140" rx="4" fill="#ef709d" stroke="#3e317e" stroke-width="7"/>',
        rectangle: '<rect x="12" y="45" width="176" height="105" rx="4" fill="#62b982" stroke="#3e317e" stroke-width="7"/>',
        pentagon: '<polygon points="100,12 184,74 152,166 48,166 16,74" fill="#73a7e0" stroke="#3e317e" stroke-width="7"/>',
        hexagon: '<polygon points="50,20 150,20 190,92 150,164 50,164 10,92" fill="#9a7bd3" stroke="#3e317e" stroke-width="7"/>',
        circle: '<circle cx="100" cy="92" r="76" fill="#f28c63" stroke="#3e317e" stroke-width="7"/>',
        cube: '<path d="m100 16 72 40v80l-72 40-72-40V56zM28 56l72 42 72-42M100 98v78" fill="#73a7e0" stroke="#3e317e" stroke-width="7" stroke-linejoin="round"/>'
      };
      return `<svg class="math-visual" viewBox="0 0 200 185" role="img" aria-label="${shape}">${shapes[shape]}</svg>`;
    }

    /* ------------------------------------------------------------------
       QUESTION GENERATION
       Every generator returns the same simple interface:
       prompt, narration, optional SVG visual, four choices, answer, hints.
       ------------------------------------------------------------------ */
    function placeValueQuestion(tier) {
      if (tier === 1) {
        const tens = rand(2, 9), ones = rand(0, 9), number = tens * 10 + ones;
        const askTens = Math.random() < .5;
        const answer = askTens ? tens : ones;
        const place = askTens ? "tens" : "ones";
        return {
          prompt: `In ${number}, what digit is in the ${place} place?`,
          narration: `In ${number}, what digit is in the ${place} place?`,
          visual: `<div style="font-size:4rem;font-weight:900;color:#5f4bb6">${number}</div>`,
          choices: numericChoices(answer, 2, 0, 9), answer,
          hints: [`Look at the ${place} place in the number.`, askTens ? `${number} has ${tens} groups of ten.` : `${number} has ${ones} extra ones.`, `The answer is ${answer}.`]
        };
      }
      const maxHundreds = tier === 2 ? 5 : 9;
      const hundreds = rand(1, maxHundreds), tens = rand(0, 9), ones = rand(0, 9);
      const number = hundreds * 100 + tens * 10 + ones;
      if (Math.random() < .5) {
        const place = pick(["hundreds", "tens", "ones"]);
        const answer = { hundreds, tens, ones }[place];
        return {
          prompt: `In ${number}, what digit is in the ${place} place?`,
          narration: `In ${number}, what digit is in the ${place} place?`,
          visual: `<div style="font-size:4rem;font-weight:900;color:#5f4bb6">${number}</div>`,
          choices: numericChoices(answer, 3, 0, 9), answer,
          hints: [`Read the places from right to left: ones, tens, hundreds.`, `${number} is ${hundreds} hundreds, ${tens} tens, and ${ones} ones.`, `The ${place} digit is ${answer}.`]
        };
      }
      const answer = number;
      return {
        prompt: `${hundreds} hundreds + ${tens} tens + ${ones} ones = ?`,
        narration: `${hundreds} hundreds plus ${tens} tens plus ${ones} ones equals what number?`,
        visual: "",
        choices: numericChoices(answer, tier === 3 ? 50 : 20, 0, 999), answer,
        hints: [`Hundreds are worth 100, tens are worth 10, and ones are worth 1.`, `${hundreds * 100} + ${tens * 10} + ${ones}`, `The number is ${answer}.`]
      };
    }

    function additionQuestion(tier) {
      let a, b;
      if (tier === 1) { a = rand(5, 30); b = rand(2, 20); }
      else if (tier === 2) { a = rand(20, 65); b = rand(10, 30); }
      else { a = rand(28, 75); b = rand(12, 99 - a); }
      const answer = a + b;
      const missing = tier > 1 && Math.random() < .35;
      if (missing) {
        return {
          prompt: `${a} + ? = ${answer}`,
          narration: `${a} plus what number equals ${answer}?`,
          visual: "", choices: numericChoices(b, 6, 0, 100), answer: b,
          hints: [`Start at ${a} and count up to ${answer}.`, `You can subtract: ${answer} − ${a}.`, `${answer} − ${a} = ${b}.`]
        };
      }
      return {
        prompt: `${a} + ${b} = ?`, narration: `What is ${a} plus ${b}?`, visual: "",
        choices: numericChoices(answer, tier * 5, 0, 100), answer,
        hints: [`Try making a ten or adding the tens first.`, `${a} + ${Math.floor(b / 10) * 10} = ${a + Math.floor(b / 10) * 10}, then add ${b % 10}.`, `${a} + ${b} = ${answer}.`]
      };
    }

    function subtractionQuestion(tier) {
      const top = tier === 1 ? rand(12, 40) : tier === 2 ? rand(35, 80) : rand(55, 100);
      const bottom = tier === 1 ? rand(2, top - 3) : rand(10, top - 10);
      const answer = top - bottom;
      const missing = tier > 1 && Math.random() < .35;
      if (missing) {
        return {
          prompt: `? − ${bottom} = ${answer}`, narration: `What number minus ${bottom} equals ${answer}?`,
          visual: "", choices: numericChoices(top, 7, 0, 100), answer: top,
          hints: [`Use addition to undo subtraction.`, `${answer} + ${bottom} will find the missing number.`, `${answer} + ${bottom} = ${top}.`]
        };
      }
      return {
        prompt: `${top} − ${bottom} = ?`, narration: `What is ${top} minus ${bottom}?`, visual: "",
        choices: numericChoices(answer, tier * 5, 0, 100), answer,
        hints: [`Count back, or subtract tens and then ones.`, `Take away ${Math.floor(bottom / 10) * 10}, then take away ${bottom % 10}.`, `${top} − ${bottom} = ${answer}.`]
      };
    }

    function wordProblemQuestion(tier) {
      const names = ["Mina", "Leo", "Ava", "Kai", "Noah"];
      const things = ["glowing stones", "castle stickers", "toy dragons", "blue ribbons", "magic beans"];
      const name = pick(names), thing = pick(things);
      const add = Math.random() < .55;
      const start = tier === 1 ? rand(6, 25) : rand(20, tier === 2 ? 55 : 75);
      const change = add ? rand(3, Math.min(24, 100 - start)) : rand(3, Math.min(24, start - 1));
      const answer = add ? start + change : start - change;
      const prompt = add
        ? `${name} has ${start} ${thing}. A friend gives ${name} ${change} more. How many now?`
        : `${name} has ${start} ${thing} and gives away ${change}. How many are left?`;
      return {
        prompt, narration: prompt, visual: `<div style="font-size:3.2rem" aria-hidden="true">${add ? "🎁 ➕" : "🎁 ➖"}</div>`,
        choices: numericChoices(answer, 6, 0, 100), answer,
        hints: [add ? `The words “more” and “now” tell us to add.` : `The words “gives away” and “left” tell us to subtract.`, `${start} ${add ? "+" : "−"} ${change}`, `${start} ${add ? "+" : "−"} ${change} = ${answer}.`]
      };
    }

    function skipCountingQuestion(tier) {
      const step = tier === 1 ? pick([2, 5, 10]) : tier === 2 ? pick([2, 3, 5, 10]) : pick([3, 4, 5, 10]);
      const start = step * rand(0, tier === 3 ? 8 : 5);
      const sequence = [start, start + step, start + step * 2, start + step * 3, start + step * 4];
      const missingIndex = rand(1, 3);
      const answer = sequence[missingIndex];
      const shown = sequence.map((n, i) => i === missingIndex ? "?" : n).join(", ");
      const groups = tier === 3 && Math.random() < .45;
      if (groups) {
        const groupCount = rand(2, 5), each = rand(2, 5);
        const groupAnswer = groupCount * each;
        return {
          prompt: `${groupCount} groups of ${each} stars make how many stars?`,
          narration: `${groupCount} groups of ${each} stars make how many stars?`,
          visual: `<div style="font-size:2rem;line-height:1.5">${Array.from({length: groupCount}, () => `<span style="white-space:nowrap">${"⭐".repeat(each)}</span>`).join(" &nbsp; ")}</div>`,
          choices: numericChoices(groupAnswer, 3, 0, 30), answer: groupAnswer,
          hints: [`Count ${each} stars in each group.`, `Skip-count by ${each}, ${groupCount} times.`, `${groupCount} groups of ${each} make ${groupAnswer}.`]
        };
      }
      return {
        prompt: `What number is missing? ${shown}`, narration: `What number is missing? ${shown.replace("?", "blank")}`,
        visual: "", choices: numericChoices(answer, step, 0, 100), answer,
        hints: [`The pattern adds ${step} each time.`, `Start at ${sequence[missingIndex - 1]} and add ${step}.`, `${sequence[missingIndex - 1]} + ${step} = ${answer}.`]
      };
    }

    function timeQuestion(tier) {
      const minuteSets = tier === 1 ? [0, 30] : tier === 2 ? [0, 15, 30, 45] : Array.from({length: 12}, (_, i) => i * 5);
      const hour = rand(1, 12), minute = pick(minuteSets);
      const answer = formatTime(hour, minute);
      const choices = new Set([answer]);
      while (choices.size < 4) {
        const offset = pick([-15, -10, -5, 5, 10, 15]);
        const total = ((hour % 12) * 60 + minute + offset + 720) % 720;
        const h = Math.floor(total / 60) || 12;
        choices.add(formatTime(h, total % 60));
      }
      return {
        prompt: "What time does the clock show?", narration: "What time does the clock show?",
        visual: clockSvg(hour, minute), choices: shuffle([...choices]), answer,
        hints: [`The short hand shows the hour. The long hand shows the minutes.`, `The short hand is near ${hour}. Count by fives around the clock for the minute hand.`, `The clock shows ${answer}.`]
      };
    }

    function moneyQuestion(tier) {
      const coinPool = tier === 1 ? [1, 5, 10] : [1, 5, 10, 25];
      const count = tier === 1 ? rand(2, 4) : rand(3, tier === 2 ? 5 : 6);
      const coins = Array.from({length: count}, () => pick(coinPool)).sort((a,b) => b-a);
      const cents = coins.reduce((sum, coin) => sum + coin, 0);
      const answer = tier === 3 && cents >= 100 ? formatMoney(cents) : `${cents}¢`;
      const values = new Set([answer]);
      while (values.size < 4) {
        const candidate = clamp(cents + pick([-10, -5, -1, 1, 5, 10]), 1, 200);
        values.add(tier === 3 && cents >= 100 ? formatMoney(candidate) : `${candidate}¢`);
      }
      return {
        prompt: "How much money is shown?", narration: "How much money is shown?",
        visual: coinSvg(coins), choices: shuffle([...values]), answer,
        hints: [`Name each coin, then count from the greatest value to the least.`, `Add these values: ${coins.join(" + ")} cents.`, `The coins total ${cents} cents${cents >= 100 ? `, or ${formatMoney(cents)}` : ""}.`]
      };
    }

    function measurementQuestion(tier) {
      const a = rand(3, tier === 1 ? 9 : 14);
      let b = rand(3, tier === 1 ? 9 : 14);
      while (b === a) b = rand(3, tier === 1 ? 9 : 14);
      if (tier === 1 || Math.random() < .55) {
        const askLonger = Math.random() < .5;
        const answer = askLonger ? (a > b ? "Ribbon A" : "Ribbon B") : (a < b ? "Ribbon A" : "Ribbon B");
        return {
          prompt: `Which ribbon is ${askLonger ? "longer" : "shorter"}?`,
          narration: `Which ribbon is ${askLonger ? "longer" : "shorter"}?`,
          visual: rulerSvg(a, b), choices: shuffle(["Ribbon A", "Ribbon B", "They are equal", "Not enough information"]), answer,
          hints: [`Compare where each ribbon ends on the ruler.`, `Ribbon A is ${a} inches. Ribbon B is ${b} inches.`, `${answer} is ${askLonger ? "longer" : "shorter"}.`]
        };
      }
      const answer = Math.abs(a - b);
      const longer = a > b ? "A" : "B";
      return {
        prompt: `How many inches longer is Ribbon ${longer}?`, narration: `How many inches longer is Ribbon ${longer}?`,
        visual: rulerSvg(a, b), choices: numericChoices(answer, 2, 0, 15), answer,
        hints: [`Find the difference between the two lengths.`, `Subtract the shorter length from the longer length: ${Math.max(a,b)} − ${Math.min(a,b)}.`, `The difference is ${answer} inches.`]
      };
    }

    function fractionQuestion(tier) {
      const parts = tier === 1 ? 2 : tier === 2 ? pick([2, 3, 4]) : pick([3, 4]);
      const shaded = tier === 1 ? 1 : rand(1, parts - 1);
      const names = { "1/2": "one half", "1/3": "one third", "2/3": "two thirds", "1/4": "one fourth", "2/4": "two fourths", "3/4": "three fourths" };
      const answer = `${shaded}/${parts}`;
      const possible = ["1/2", "1/3", "2/3", "1/4", "2/4", "3/4"].filter(item => item !== answer);
      return {
        prompt: "What fraction of the shape is shaded?", narration: "What fraction of the shape is shaded?",
        visual: fractionSvg(parts, shaded), choices: shuffle([answer, ...shuffle(possible).slice(0,3)]), answer,
        hints: [`The bottom number tells how many equal parts there are.`, `There are ${parts} equal parts, and ${shaded} ${shaded === 1 ? "is" : "are"} shaded.`, `${shaded} out of ${parts} is ${names[answer] || answer}.`]
      };
    }

    function geometryQuestion(tier) {
      const basic = ["triangle", "square", "rectangle", "circle"];
      const advanced = ["pentagon", "hexagon"];
      if (tier === 1 || Math.random() < .55) {
        const shape = pick(tier === 1 ? basic : [...basic, ...advanced]);
        const pool = shuffle([...basic, ...advanced].filter(item => item !== shape)).slice(0,3);
        return {
          prompt: "What shape is this?", narration: "What shape is this?",
          visual: shapeSvg(shape), choices: shuffle([shape, ...pool]), answer: shape,
          hints: [`Count the straight sides and corners.`, `${shape === "circle" ? "This shape has no straight sides or corners." : `This shape has ${{triangle:3,square:4,rectangle:4,pentagon:5,hexagon:6}[shape]} sides.`}`, `This shape is a ${shape}.`]
        };
      }
      if (tier === 3 && Math.random() < .4) {
        return {
          prompt: "Which shape is three-dimensional (a solid shape)?", narration: "Which shape is three-dimensional, or a solid shape?",
          visual: shapeSvg("cube"), choices: shuffle(["cube", "square", "triangle", "circle"]), answer: "cube",
          hints: [`A solid shape takes up space and can be held.`, `The picture shows faces, edges, and corners.`, `It is a cube.`]
        };
      }
      const sides = pick(tier === 2 ? [3,4,5] : [3,4,5,6]);
      const answers = {3:"triangle",4:"quadrilateral",5:"pentagon",6:"hexagon"};
      const answer = answers[sides];
      return {
        prompt: `Which shape name means a shape with ${sides} sides?`, narration: `Which shape name means a shape with ${sides} sides?`,
        visual: "", choices: shuffle([answer, ...shuffle(["triangle","quadrilateral","pentagon","hexagon"].filter(x => x !== answer)).slice(0,3)]), answer,
        hints: [`Shape names can tell how many sides a shape has.`, `Count ${sides} sides and remember its geometry name.`, `A ${sides}-sided shape is called a ${answer}.`]
      };
    }

    const GENERATORS = [
      placeValueQuestion, additionQuestion, subtractionQuestion, wordProblemQuestion,
      skipCountingQuestion, timeQuestion, moneyQuestion, measurementQuestion,
      fractionQuestion, geometryQuestion
    ];

    function makeQuestion() {
      const stats = state.stats[state.currentLevel];
      state.hintStep = 0;
      state.answered = false;
      state.currentQuestion = GENERATORS[state.currentLevel](stats.difficulty);
    }

    /* ------------------------------------------------------------------
       ADAPTIVE LOGIC AND REWARDS
       Difficulty rises after each three-answer correct streak, up to tier 3.
       An incorrect answer reveals a scaffold and never removes mastery.
       ------------------------------------------------------------------ */
    function chooseAnswer(value, button) {
      if (state.answered) return;
      const question = state.currentQuestion;
      const stats = state.stats[state.currentLevel];
      stats.attempts += 1;
      const isCorrect = String(value) === String(question.answer);

      if (isCorrect) {
        state.answered = true;
        stats.correct += 1;
        stats.streak += 1;
        const points = state.hintStep > 0 ? 8 : 12;
        stats.mastery = Math.min(100, stats.mastery + points);
        if (stats.streak >= 3 && stats.difficulty < 3) {
          stats.difficulty += 1;
          stats.streak = 0;
        }
        document.querySelectorAll(".choice").forEach(choice => choice.disabled = true);
        button.classList.add("correct");
        const feedback = document.getElementById("feedback");
        feedback.className = "feedback success";
        feedback.innerHTML = `✨ You found it! <strong>+${points} mastery</strong>${stats.difficulty > 1 ? ` · Challenge level ${stats.difficulty}` : ""}`;
        document.getElementById("nextQuestion").classList.remove("hidden");
        document.getElementById("hintButton").classList.add("hidden");
        playEffect("correct");
        speak(`Wonderful work! The answer is ${question.answer}.`);
        announce(`Correct. You earned ${points} mastery points.`);
        if (stats.mastery >= 90 && !stats.mastered) {
          stats.mastered = true;
          state.rewards.push(state.currentLevel);
          state.unlockedLevel = Math.min(LEVELS.length - 1, Math.max(state.unlockedLevel, state.currentLevel + 1));
          document.getElementById("nextQuestion").textContent = "See My Reward ✨";
        }
      } else {
        stats.streak = 0;
        state.hintStep = Math.min(3, state.hintStep + 1);
        button.classList.add("try-again");
        window.setTimeout(() => button.classList.remove("try-again"), 700);
        const feedback = document.getElementById("feedback");
        feedback.className = "feedback";
        feedback.textContent = `Good try — let’s look at it another way. ${question.hints[state.hintStep - 1]}`;
        document.getElementById("hintButton").textContent = state.hintStep >= 3 ? "Read Hint Again" : "Another Hint";
        playEffect("try");
        speak(`Good try. ${question.hints[state.hintStep - 1]}`);
        announce("Good try. A new hint is ready.");
      }
      updateQuestionMeter();
    }

    function showHint() {
      const question = state.currentQuestion;
      state.hintStep = Math.min(3, state.hintStep + 1);
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback";
      feedback.textContent = `Hint ${state.hintStep}: ${question.hints[state.hintStep - 1]}`;
      document.getElementById("hintButton").textContent = state.hintStep >= 3 ? "Read Hint Again" : "Another Hint";
      speak(question.hints[state.hintStep - 1]);
      announce(`Hint ${state.hintStep}. ${question.hints[state.hintStep - 1]}`);
    }

    function nextQuestion() {
      if (state.stats[state.currentLevel].mastered && state.rewards.includes(state.currentLevel)) {
        setScreen("complete");
        playEffect("level");
        return;
      }
      makeQuestion();
      renderQuestion();
    }

    function updateQuestionMeter() {
      const stats = state.stats[state.currentLevel];
      const fill = document.getElementById("questionMeter");
      const label = document.getElementById("questionMastery");
      if (fill) fill.style.width = `${stats.mastery}%`;
      if (label) label.textContent = `${stats.mastery} mastery`;
    }

    /* ------------------------------------------------------------------
       AUDIO: WEB SPEECH + WEB AUDIO
       Audio begins disabled and is only created following a user action.
       ------------------------------------------------------------------ */
    let audioContext = null;
    let musicTimer = null;
    let musicStep = 0;

    function getAudioContext() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        audioContext = new AudioContext();
      }
      if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
      return audioContext;
    }

    function tone(frequency, duration, volume = .035, delay = 0) {
      const context = getAudioContext();
      if (!context) return;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(.0001, context.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(volume, context.currentTime + delay + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + delay + duration);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(context.currentTime + delay);
      oscillator.stop(context.currentTime + delay + duration + .05);
    }

    function playEffect(kind) {
      if (!state.audio.sound) return;
      if (kind === "correct") { tone(523, .18); tone(659, .2, .035, .1); tone(784, .28, .035, .2); }
      else if (kind === "level") { [392,523,659,784].forEach((note, i) => tone(note, .35, .04, i * .13)); }
      else tone(330, .16, .025);
    }

    function musicNote() {
      if (!state.audio.music) return;
      const melody = [261.6, 329.6, 392, 329.6, 293.7, 349.2, 440, 349.2];
      tone(melody[musicStep++ % melody.length], .8, .012);
    }

    function startMusic() {
      stopMusic();
      musicNote();
      musicTimer = window.setInterval(musicNote, 1100);
    }

    function stopMusic() {
      if (musicTimer) window.clearInterval(musicTimer);
      musicTimer = null;
    }

    function speak(text, force = false) {
      lastNarration = text || lastNarration;
      if ((!state.audio.narration && !force) || !("speechSynthesis" in window) || !lastNarration) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(lastNarration);
      utterance.rate = .88;
      utterance.pitch = 1.08;
      utterance.volume = .9;
      window.speechSynthesis.speak(utterance);
    }

    function toggleAudio(kind) {
      state.audio[kind] = !state.audio[kind];
      if (kind === "music") state.audio.music ? startMusic() : stopMusic();
      if (kind === "narration" && state.audio.narration) speak(currentScreenNarration(), true);
      updateAudioButtons();
    }

    function updateAudioButtons() {
      ["narration", "sound", "music"].forEach(kind => {
        const button = document.getElementById(`${kind}Toggle`);
        const on = state.audio[kind];
        button.setAttribute("aria-pressed", String(on));
        button.title = `${kind[0].toUpperCase() + kind.slice(1)} ${on ? "on" : "off"}`;
        button.querySelector(".control-text").textContent = on ? "On" : "Off";
      });
    }

    function currentScreenNarration() {
      if (state.screen === "welcome") return "Welcome to Castle Math Quest. Press begin your adventure to start.";
      if (state.screen === "avatar") return "Choose a quest hero.";
      if (state.screen === "map") return "Choose an unlocked castle math level.";
      if (state.screen === "question" && state.currentQuestion) return state.currentQuestion.narration;
      if (state.screen === "complete") return "Level mastered! You unlocked a new royal reward.";
      return "Parent and teacher dashboard.";
    }

    /* ------------------------------------------------------------------
       RENDERING
       ------------------------------------------------------------------ */
    function render() {
      if (state.screen === "welcome") renderWelcome();
      else if (state.screen === "avatar") renderAvatars();
      else if (state.screen === "map") renderMap();
      else if (state.screen === "question") renderQuestion();
      else if (state.screen === "complete") renderComplete();
      else if (state.screen === "dashboard") renderDashboard();
      updateAudioButtons();
      lastNarration = currentScreenNarration();
      if (state.audio.narration) window.setTimeout(() => speak(lastNarration), 180);
    }

    function renderWelcome() {
      game.innerHTML = `
        <section class="screen">
          <div class="panel"><div class="content-layer welcome-grid">
            <div>
              <p class="eyebrow">A brave learning adventure</p>
              <h1>Castle Math Quest</h1>
              <p class="lead">Choose a hero, explore a magical kingdom, and grow your math powers one friendly challenge at a time.</p>
              <div class="button-row">
                <button class="primary" type="button" data-action="start">Begin Your Adventure</button>
                <button class="secondary" type="button" data-action="replay">🔊 Hear Welcome</button>
              </div>
              <p style="margin-top:24px;font-weight:800;color:#5b5572">No timers. No lost points. Just practice, hints, and celebration!</p>
            </div>
            <div class="castle-hero" aria-hidden="true">
              <span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✦</span>
              ${castleSvg()}
            </div>
          </div></div>
        </section>`;
    }

    function renderAvatars() {
      game.innerHTML = `
        <section class="screen">
          <div class="panel"><div class="content-layer">
            <p class="eyebrow">The royal quest needs a hero</p>
            <h2>Choose Your Adventurer</h2>
            <p class="lead">Every hero has the same mighty math powers. Pick the friend you like best!</p>
            <div class="avatar-grid">
              ${AVATARS.map(avatar => `
                <button type="button" class="avatar-card ${state.avatar === avatar.id ? "selected" : ""}" data-avatar="${avatar.id}" aria-pressed="${state.avatar === avatar.id}">
                  ${avatarArt(avatar.id)}
                  <span class="avatar-label">${avatar.name}</span>
                </button>`).join("")}
            </div>
            <div class="button-row">
              <button class="secondary" type="button" data-action="welcome">Back</button>
              <button class="primary" type="button" data-action="map" ${state.avatar ? "" : "disabled"}>Enter the Castle Map</button>
            </div>
          </div></div>
        </section>`;
    }

    function renderMap() {
      const avatar = AVATARS.find(item => item.id === state.avatar);
      game.innerHTML = `
        <section class="screen map-screen">
          <div class="map-shell">
            <div class="map-heading">
              <div>
                <p class="eyebrow">The kingdom of number lore</p>
                <h2 style="margin-bottom:5px">Castle Map</h2>
                <p style="margin:0;font-weight:800">Master a place to open the next path.</p>
              </div>
              <div class="button-row">
                <div class="hero-chip">${avatarArt(state.avatar)}<span>${escapeHtml(avatar.name)}</span></div>
                <button class="secondary" type="button" data-action="closet">✨ Avatar Closet</button>
              </div>
            </div>
            <div class="map-path" aria-label="Math level map">
              ${LEVELS.map((level, index) => {
                const unlocked = index <= state.unlockedLevel;
                const stats = state.stats[index];
                return `<button type="button" class="level-node ${unlocked ? "unlocked" : "locked"}" data-level="${index}" ${unlocked ? "" : "disabled"} aria-label="Level ${index + 1}, ${level.name}, ${unlocked ? `${stats.mastery} mastery` : "locked"}">
                  <span class="node-number">${stats.mastered ? "✓" : index + 1}</span>
                  <span class="level-icon" aria-hidden="true">${unlocked ? level.icon : "🔒"}</span>
                  <span class="level-name">${level.short}</span>
                  <span class="meter"><span class="meter-fill" style="width:${stats.mastery}%"></span></span>
                  <span class="mastery-label">${stats.mastery} / 90 mastery</span>
                </button>`;
              }).join("")}
            </div>
          </div>
        </section>`;
    }

    function renderQuestion() {
      if (!state.currentQuestion) makeQuestion();
      const level = LEVELS[state.currentLevel];
      const stats = state.stats[state.currentLevel];
      const question = state.currentQuestion;
      game.innerHTML = `
        <section class="screen">
          <div class="panel question-shell"><div class="content-layer">
            <div class="quest-head">
              <div class="mini-avatar">${avatarArt(state.avatar)}</div>
              <div class="quest-meta">
                <p class="eyebrow" style="margin-bottom:3px">Level ${state.currentLevel + 1}</p>
                <h2>${level.icon} ${level.name}</h2>
                <div class="meter"><div class="meter-fill" id="questionMeter" style="width:${stats.mastery}%"></div></div>
                <div style="display:flex;justify-content:space-between;gap:10px;margin-top:5px">
                  <span class="mastery-label" id="questionMastery">${stats.mastery} mastery</span>
                  <span class="difficulty-stars" aria-label="Challenge level ${stats.difficulty}">${"★".repeat(stats.difficulty)}${"☆".repeat(3-stats.difficulty)}</span>
                </div>
              </div>
              <button class="small-btn" type="button" data-action="map">Back to Map</button>
            </div>
            <div class="question-card">
              <p class="question-prompt">${question.prompt}</p>
              <div class="visual-stage">${question.visual}</div>
              <div class="choice-grid">
                ${question.choices.map(choice => `<button type="button" class="choice" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`).join("")}
              </div>
              <div class="feedback" id="feedback" aria-live="polite">Take your time. Your hero believes in you!</div>
              <div class="button-row question-actions">
                <button class="secondary" id="hintButton" type="button" data-action="hint">💡 Show a Hint</button>
                <button class="small-btn" type="button" data-action="replay">🔊 Replay Question</button>
                <button class="primary hidden" id="nextQuestion" type="button" data-action="next">Next Challenge</button>
              </div>
            </div>
          </div></div>
        </section>`;
    }

    function renderComplete() {
      const level = LEVELS[state.currentLevel];
      const reward = level.reward;
      const finalLevel = state.currentLevel === LEVELS.length - 1;
      game.innerHTML = `
        <section class="screen">
          <div class="panel complete-panel"><div class="content-layer">
            <div class="celebration-stage">
              <span class="celebration-burst b1" aria-hidden="true">✦</span>
              <span class="celebration-burst b2" aria-hidden="true">${finalLevel ? "🏆" : "✦"}</span>
              <span class="celebration-burst b3" aria-hidden="true">✦</span>
              ${avatarArt(state.avatar)}
            </div>
            <p class="eyebrow">${finalLevel ? "The whole kingdom celebrates" : "Level mastered"}</p>
            <h1 style="font-size:clamp(2.2rem,7vw,4.4rem)">${finalLevel ? "Royal Math Champion!" : `${level.name} Master!`}</h1>
            <p class="lead">Your patient practice made your math powers stronger.</p>
            <div class="reward-card">
              ${rewardArt(reward)}
              <h3 style="font-size:1.5rem;margin:5px 0">New Reward: ${reward[0]}</h3>
              <p style="margin:0">Unlocked in your avatar closet!</p>
            </div>
            <div class="button-row" style="justify-content:center">
              <button class="primary" type="button" data-action="map">${finalLevel ? "Return to the Castle" : "Explore the Next Path"}</button>
              <button class="secondary" type="button" data-action="closet">See My Closet</button>
            </div>
          </div></div>
        </section>`;
    }

    /* ------------------------------------------------------------------
       REWARD CLOSET
       ------------------------------------------------------------------ */
    function openCloset() {
      modalRoot.innerHTML = `
        <div class="modal-backdrop" role="presentation">
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="closetTitle">
            <button class="small-btn modal-close" type="button" data-action="close-modal" aria-label="Close closet">✕</button>
            <p class="eyebrow">Hero treasures</p>
            <h2 id="closetTitle">Avatar Closet</h2>
            <p>Master each castle level to collect all ten royal rewards.</p>
            <div class="closet-grid">
              ${LEVELS.map((level, index) => {
                const unlocked = state.rewards.includes(index);
                return `<div class="reward-tile ${unlocked ? "" : "locked"}">
                  <div>${unlocked ? rewardArt(level.reward, "small") : '<span class="reward-icon" aria-hidden="true">🔒</span>'}</div>
                  <div>${unlocked ? level.reward[0] : `Level ${index + 1} Reward`}</div>
                  <small>${unlocked ? "Unlocked!" : level.short}</small>
                </div>`;
              }).join("")}
            </div>
          </section>
        </div>`;
      modalRoot.querySelector(".modal-close").focus();
    }

    function closeModal() { modalRoot.innerHTML = ""; }

    /* ------------------------------------------------------------------
       PARENT / TEACHER DASHBOARD
       ------------------------------------------------------------------ */
    function renderDashboard() {
      const totalAttempts = state.stats.reduce((sum, stat) => sum + stat.attempts, 0);
      const totalCorrect = state.stats.reduce((sum, stat) => sum + stat.correct, 0);
      const mastered = state.stats.filter(stat => stat.mastered).length;
      game.innerHTML = `
        <section class="screen dashboard-panel">
          <div class="panel"><div class="content-layer">
            <p class="eyebrow">Session snapshot</p>
            <h2>Parent & Teacher Dashboard</h2>
            <p>Progress is kept only for this open browser session and disappears when the page closes or refreshes.</p>
            <div class="dashboard-summary">
              <div class="summary-card"><strong>${mastered}</strong>Levels mastered</div>
              <div class="summary-card"><strong>${totalAttempts}</strong>Total answers</div>
              <div class="summary-card"><strong>${totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0}%</strong>Accuracy</div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Skill</th><th>Mastery</th><th>Accuracy</th><th>Attempts</th><th>Challenge</th><th>Status</th><th>Reward</th></tr></thead>
                <tbody>
                  ${LEVELS.map((level, index) => {
                    const stat = state.stats[index];
                    const accuracy = stat.attempts ? Math.round(stat.correct / stat.attempts * 100) : 0;
                    return `<tr>
                      <td>${index + 1}. ${level.short}</td><td>${stat.mastery}</td><td>${accuracy}%</td><td>${stat.attempts}</td>
                      <td>${stat.difficulty} / 3</td><td>${stat.mastered ? "Mastered" : index <= state.unlockedLevel ? "Learning" : "Locked"}</td>
                      <td>${state.rewards.includes(index) ? `${rewardArt(level.reward, "tiny")} ${level.reward[0]}` : "Locked"}</td>
                    </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>
            <div class="button-row dashboard-actions">
              <button class="secondary" type="button" data-action="dashboard-back">Return to Game</button>
              <button class="small-btn danger" type="button" data-action="reset">Reset This Session</button>
            </div>
          </div></div>
        </section>`;
    }

    function resetSession() {
      if (!window.confirm("Reset all progress from this session? This cannot be undone.")) return;
      state.avatar = null;
      state.currentLevel = 0;
      state.unlockedLevel = 0;
      state.stats = freshStats();
      state.rewards = [];
      state.currentQuestion = null;
      state.hintStep = 0;
      state.answered = false;
      setScreen("welcome");
      announce("Session progress reset.");
    }

    /* ------------------------------------------------------------------
       EVENT ROUTING AND KEYBOARD-FRIENDLY CONTROLS
       ------------------------------------------------------------------ */
    document.addEventListener("click", event => {
      const avatarButton = event.target.closest("[data-avatar]");
      if (avatarButton) {
        state.avatar = avatarButton.dataset.avatar;
        playEffect("correct");
        renderAvatars();
        return;
      }
      const levelButton = event.target.closest("[data-level]");
      if (levelButton && !levelButton.disabled) {
        state.currentLevel = Number(levelButton.dataset.level);
        state.currentQuestion = null;
        makeQuestion();
        setScreen("question");
        return;
      }
      const answerButton = event.target.closest("[data-answer]");
      if (answerButton) {
        chooseAnswer(answerButton.dataset.answer, answerButton);
        return;
      }
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      if (action === "start") setScreen("avatar");
      else if (action === "welcome") setScreen("welcome");
      else if (action === "map") setScreen("map");
      else if (action === "hint") showHint();
      else if (action === "next") nextQuestion();
      else if (action === "replay") speak(state.screen === "question" ? state.currentQuestion.narration : currentScreenNarration(), true);
      else if (action === "closet") openCloset();
      else if (action === "close-modal") closeModal();
      else if (action === "dashboard-back") setScreen(state.previousScreen === "dashboard" ? "map" : state.previousScreen);
      else if (action === "reset") resetSession();
    });

    modalRoot.addEventListener("click", event => {
      if (event.target.classList.contains("modal-backdrop")) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modalRoot.innerHTML) closeModal();
    });

    document.getElementById("narrationToggle").addEventListener("click", () => toggleAudio("narration"));
    document.getElementById("soundToggle").addEventListener("click", () => toggleAudio("sound"));
    document.getElementById("musicToggle").addEventListener("click", () => toggleAudio("music"));
    document.getElementById("dashboardToggle").addEventListener("click", () => {
      if (state.screen === "dashboard") setScreen(state.previousScreen);
      else {
        state.previousScreen = state.screen;
        setScreen("dashboard");
      }
    });

    render();

    /* TODO: Add richer location-specific scenes and generated art for the remaining rewards.
       TODO: Expand each skill with more language variations after classroom play testing.
       TODO: Conduct screen-reader and switch-control testing with students and educators.
       TODO: Consider optional, consent-based persistence only in a future version. */
  </script>
</body>
</html>
